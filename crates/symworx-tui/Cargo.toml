[package]
name = "symworx-tui"
version          = { workspace = true }
edition          = { workspace = true }
license          = { workspace = true }
repository       = { workspace = true }
authors          = { workspace = true }
description = "Terminal UI (symview) for biosignal exploration, RQA/dynamics, and training load analysis"
keywords = ["tui", "biosignals", "nonlinear dynamics", "data visualization"]
categories = ["command-line-utilities", "science"]

[[bin]]
name = "symview"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
color-eyre = "0.6"
anyhow = "1.0"

polars = { workspace = true, optional = true, features = ["csv", "lazy"] }
# Use symworx-io (with its "parquet" feature) for all file I/O including Parquet.
# This is the required path per the I/O Layer rule in AGENTS.md and README.
# Polars (when the "polars" feature below is enabled) is *only* for optional
# in-memory DataFrame exploration *after* data is loaded via symworx-io.
symworx-io = { workspace = true, features = ["parquet", "fit"] }

# IMPORTANT ARCHITECTURE RULE (see AGENTS.md "I/O Layer"):
# The TUI (and all other crates) must load Parquet, CSV, IBI, etc. exclusively
# through `symworx-io`. Never enable `polars/parquet` or depend directly on
# the `parquet` crate for signal I/O — it creates unresolvable conflicts with
# multiple Arrow/brotli/allocator stacks.
#
# Polars is optional and (when enabled) is intended only for in-memory
# DataFrame exploration after data has been loaded via `symworx-io`.

symworx-core = { workspace = true }
symworx-biosym = { workspace = true }
symworx-signal = { workspace = true }
symworx-spatialsym = { workspace = true }
symworx-dynamics = { workspace = true }
# Host live streaming (simulator default; serial later via embed features).
symworx-embed = { workspace = true }
# sqlite: LoadSym Calendar reads personal catalog under $VELOFIT_HOME/db/ (never ships data).
symworx-loadsym = { workspace = true, features = ["sqlite"] }
# StatsSym lab + synthetic generators (linalg for OLS/PCA later)
symworx-stats = { workspace = true, features = ["linalg"] }
ndarray = { workspace = true }
rand = { workspace = true, features = ["std"] }
csv = { workspace = true }

# These are activated when the `polars` feature is enabled, to ensure the "std"
# feature (and thus the alloc::Allocator impls) is enabled on brotli-decompressor.
brotli-decompressor = { workspace = true, optional = true }
alloc-no-stdlib     = { workspace = true, optional = true }

[features]
default = []
# Opt-in for Polars DataFrame support in the TUI (in-memory analysis only).
# I/O must still go through symworx-io.
polars = ["dep:polars", "dep:brotli-decompressor", "dep:alloc-no-stdlib"]

[lints]
workspace = true
