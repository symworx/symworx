[package]
name = "symworx-tui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "symview"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
color-eyre = "0.6"
anyhow = "1.0"

polars = { version = "0.46", features = ["parquet", "csv", "lazy"] }
symworx-io = { path = "../symworx-io" }
symworx-core = { path = "../symworx-core" }
symworx-biosym = { path = "../symworx-biosym" }
symworx-signal = { path = "../symworx-signal" }
rand = { version = "0.9", features = ["std"] }
csv = "1.3"

[lints]
workspace = true
