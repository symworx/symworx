[package]
name = "symworx-tui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "symview"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
color-eyre = "0.6"
anyhow = "1.0"

polars = { workspace = true, optional = true, features = ["csv", "lazy"] }
symworx-io = { path = "../symworx-io" }

# IMPORTANT ARCHITECTURE RULE (see AGENTS.md "I/O Layer"):
# The TUI (and all other crates) must load Parquet, CSV, IBI, etc. exclusively
# through `symworx-io`. Never enable `polars/parquet` or depend directly on
# the `parquet` crate for signal I/O — it creates unresolvable conflicts with
# multiple Arrow/brotli/allocator stacks.
#
# Polars is optional and (when enabled) is intended only for in-memory
# DataFrame exploration after data has been loaded via `symworx-io`.

symworx-core = { path = "../symworx-core" }
symworx-biosym = { path = "../symworx-biosym" }
symworx-signal = { path = "../symworx-signal" }
rand = { version = "0.9", features = ["std"] }
csv = "1.3"

# These are activated when the `polars` feature is enabled, to ensure the "std"
# feature (and thus the alloc::Allocator impls) is enabled on brotli-decompressor.
brotli-decompressor = { workspace = true, optional = true }
alloc-no-stdlib     = { workspace = true, optional = true }

[features]
default = []
# Opt-in for Polars DataFrame support in the TUI (in-memory analysis only).
# I/O must still go through symworx-io.
polars = ["dep:polars", "dep:brotli-decompressor", "dep:alloc-no-stdlib"]

[lints]
workspace = true
