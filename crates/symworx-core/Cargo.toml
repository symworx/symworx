[package]
name = "symworx-core"
version          = { workspace = true }
edition          = { workspace = true }
license          = { workspace = true }
repository       = { workspace = true }
description      = "Core re-exports and foundational utilities for the SymWorx ecosystem (math, signal, stats, dynamics, I/O)"
keywords = ["core", "utilities", "reexports"]
categories = ["science"]

[dependencies]
symworx-backend  = { path = "../symworx-backend" }
symworx-dynamics = { path = "../symworx-dynamics" }
symworx-error    = { path = "../symworx-error" }
symworx-io       = { path = "../symworx-io" }
symworx-math     = { path = "../symworx-math" }
symworx-signal   = { path = "../symworx-signal" }
symworx-stats    = { path = "../symworx-stats", features = ["linalg"] }

[lints]
workspace = true