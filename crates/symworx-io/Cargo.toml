[package]
name = "symworx-io"
version          = { workspace = true }
edition          = { workspace = true }
license          = { workspace = true }
repository       = { workspace = true }
description      = "I/O utilities -- part of the symworx-core crate"

[dependencies]
csv          = { workspace = true }
ndarray      = { workspace = true }
# Use parquet with minimal features to avoid pulling in all compression codecs (brotli, etc.)
# which were causing version conflicts with polars' own parquet stack in the tui.
# Enable "brotli" (or other codecs) explicitly via the "brotli" feature below if needed for your Parquet files.
parquet = { version = "52.0", default-features = false, features = ["arrow", "brotli"] }
brotli = { workspace = true }
alloc-no-stdlib = { workspace = true }

symworx-error = { path = "../symworx-error" }

[features]
default = []
brotli = ["parquet/brotli"]

[lints]
workspace = true
