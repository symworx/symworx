[package]
name = "symworx-io"
version          = { workspace = true }
edition          = { workspace = true }
license          = { workspace = true }
repository       = { workspace = true }
description      = "I/O utilities -- part of the symworx-core crate"

[dependencies]
csv          = { workspace = true }
ndarray      = { workspace = true }
# Parquet support is optional (to keep heavy arrow/compression stacks
# out of default library builds). The workspace entry sets default-features = false
# for a minimal parquet. "brotli" feature (below) additionally enables compression
# support and the controlled brotli-decompressor/alloc versions.
# TUI enables the "parquet" feature on us by default so that core Import tab
# conversion ("c" key) and load work for .parquet without polars.
parquet = { workspace = true, optional = true }
brotli-decompressor = { workspace = true, optional = true }
alloc-no-stdlib = { workspace = true, optional = true }
fitparser = { workspace = true, optional = true }

# Email fetching (IMAP + MIME parsing for .fit attachments from email sources like SRM PC8)
imap = { version = "3.0.0-alpha.15", optional = true }
native-tls = { version = "0.2", optional = true }
mailparse = { version = "0.15", optional = true }

symworx-error = { path = "../symworx-error" }

[features]
default = []
parquet = ["dep:parquet", "symworx-error/parquet"]
brotli = ["parquet", "parquet/brotli", "dep:brotli-decompressor", "dep:alloc-no-stdlib"]
fit = ["dep:fitparser"]
email = ["dep:imap", "dep:native-tls", "dep:mailparse"]

[lints]
workspace = true
