[package]
name = "symworx-loadsym"
version          = { workspace = true }
edition          = { workspace = true }
license          = { workspace = true }
repository       = { workspace = true }
description      = "Training load quantification, periodization, ACWR, TSS, monotony, strain, and nutrition modeling"
keywords = ["periodization", "training-load", "acwr", "tss", "load-management", "nutrition"]
categories = ["science"]

[[bin]]
name = "symload"
path = "src/bin/symload.rs"
# The binary is always available, but email support requires the feature
# on the symworx-io dependency.

[dependencies]
ndarray         = { version = "0.15", features = ["std"] }
thiserror       = { workspace = true }

symworx-core    = { path = "../symworx-core" }

# Optional I/O support, including FIT loading and (with "email" feature) email fetching.
# The symload binary uses this.
# symworx-io is used by the `symload` binary (and can be used by library consumers
# for loading activity data before feeding into loadsym calculations).
symworx-io = { path = "../symworx-io" }

# Schema resources for DB initialization (used by `symload db print-schema`).
symworx-loadsym-db = { path = "../symworx-loadsym-db", optional = true }

# Optional personal SQLite catalog (file lives under $VELOFIT_HOME — never in-repo).
rusqlite = { version = "0.32", optional = true, features = ["bundled"] }
sha2 = { version = "0.10", optional = true }

[features]
default = []
# Enable .fit loading via symworx-io (required for `symload stats` on FIT files).
fit = ["symworx-io/fit"]
# Enable email fetching support in the symload binary (implies fit for follow-on stats).
email = ["symworx-io/email", "fit"]
# Polar AccessLink OAuth + FIT fetch (implies fit for follow-on ingest).
polar = ["symworx-io/polar", "fit"]
# Enable db schema helpers (print-schema).
db = ["dep:symworx-loadsym-db"]
# Personal SQLite catalog: init + ingest (implies fit + db).
sqlite = ["db", "fit", "dep:rusqlite", "dep:sha2"]

[lints]
workspace = true
