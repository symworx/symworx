[package]
name = "symworx-stats"
version          = { workspace = true }
edition          = { workspace = true }
license          = { workspace = true }
repository       = { workspace = true }
description      = "Statistical tools and resources (basic stats, correlation, variability, autocorrelation, and optional linear algebra)"
keywords = ["statistics", "correlation", "variability", "time-series", "linear-algebra"]
categories = ["science", "mathematics"]

[features]
default = []
## Enables SVD, PCA, and fast linear regression (l2/l1) via LAPACK.
## This pulls in ndarray-linalg + its backend (OpenBLAS by default in the workspace)
## plus transitive deps such as cauchy. Only enable if you actually need
## the advanced linear algebra functionality.
##
## Note: symworx-signal has a direct (unconditional) ndarray-linalg dependency
## because core signal processing (deconvolution etc.) requires it. The opt-in
## restriction exists primarily here in stats.
linalg = ["dep:ndarray-linalg", "dep:openblas-build"]

[dependencies]
ndarray        = { workspace = true }
ndarray-linalg = { workspace = true, optional = true }
openblas-build = { workspace = true, optional = true }

symworx-math   = { path = "../symworx-math" }

[build-dependencies]
openblas-build = { workspace = true }

[[example]]
name = "predictive_metrics_demo"
required-features = ["linalg"]

[lints]
workspace = true