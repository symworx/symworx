[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "symworx"
version = "0.3.2"
description = "SymWorx - Rust core with Python bindings (cSYM-d ecosystem)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "nate berry", email = "symworx.dev@gmail.com" }]
dependencies = []

[project.optional-dependencies]
dev = ["maturin", "pytest"]

[tool.maturin]
# Package tree: ./symworx/  |  native extension: symworx._lib (see src/lib.rs)
python-source = "."
module-name = "symworx._lib"
# Do not set features = ["extension-module"] here — that is a pyo3 dependency
# feature (already enabled in workspace Cargo.toml), not a package feature.
