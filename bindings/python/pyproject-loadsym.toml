[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "symworx-loadsym"
version = "0.3.2"
description = "Training load quantification, periodization, ACWR, TSS, monotony, strain, and nutrition modeling with Rust + PyO3"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

[tool.maturin]
manifest-path = "../crates/symworx-loadsym/Cargo.toml"
module-name = "symworx_loadsym"
features = ["extension-module"]
