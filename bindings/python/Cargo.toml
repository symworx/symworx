[package]
name = "symworx-python"
version.workspace = true
edition.workspace = true

[lib]
name       = "symworx"
crate-type = ["cdylib"]

[dependencies]
pyo3            = { workspace = true }
ndarray         = { workspace = true }

numpy           = { version = "0.23" }
rand            = { workspace = true }

symworx-core    = { path = "../../crates/symworx-core", version = "0.1" }
symworx-biosym  = { path = "../../crates/symworx-biosym", version = "0.1" }
symworx-loadsym = { path = "../../crates/symworx-loadsym", version = "0.1" }
# io for activity/FIT + email (SRM fetch) loading.
# Email feature pulls imap etc; can be stripped if not needed.
symworx-io      = { path = "../../crates/symworx-io", version = "0.1", default-features = false, features = ["fit", "email"] }

[lints]
workspace = true