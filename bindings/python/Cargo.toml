[package]
name = "symworx-python"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
[lib]
name       = "symworx"
crate-type = ["cdylib"]

[dependencies]
pyo3            = { workspace = true }
ndarray         = { workspace = true }

numpy           = { version = "0.23" }
rand            = { workspace = true }

symworx-core    = { workspace = true }
symworx-biosym  = { workspace = true }
symworx-loadsym = { workspace = true }
# FIT loading for activity helpers. IMAP/email is optional (needs OpenSSL).
# crate default features are empty; enable fit only (email is opt-in via feature)
symworx-io      = { workspace = true, features = ["fit"] }

[features]
default = []
# Optional IMAP .fit fetch (`fetch_srm_fit_attachments`). Requires OpenSSL.
email = ["symworx-io/email"]

[lints]
workspace = true