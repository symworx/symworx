[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "symworx-core"
version = "0.3.0"
description = "Core re-exports and foundational utilities for the SymWorx ecosystem (math, signal, stats, dynamics, I/O)"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

[tool.maturin]
module-name = "symworx_core"
features = ["extension-module"]
