[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "symworx-core"
version = "0.1.0"
description = "SymWorx core utilities (math, stats, IO, processing)"
requires-python = ">=3.12"
license = { text = "MPL-2.0" }

[tool.maturin]
module-name = "symworx_core"
features = ["extension-module"]