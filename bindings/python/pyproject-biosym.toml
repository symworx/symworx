[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "symworx-biosym"
version = "0.1.0"
description = "BioSym - Biological modeling (gait, CPG, physiology) with Rust + PyO3"
requires-python = ">=3.12"
license = { text = "MPL-2.0" }

[tool.maturin]
manifest-path = "../crates/symworx-biosym/Cargo.toml"
module-name = "symworx_biosym"
features = ["extension-module"]
