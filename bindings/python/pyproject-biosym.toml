[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "symworx-biosym"
version = "0.4.0"
description = "Biological and biomechanical modeling tools: physiological signals (PPG, respiration), gait analysis, and central pattern generators (CPG) with Rust + PyO3"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

[tool.maturin]
manifest-path = "../crates/symworx-biosym/Cargo.toml"
module-name = "symworx_biosym"
features = ["extension-module"]
