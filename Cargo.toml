[workspace]
resolver = "2"
members = [
    "crates/symworx-error",
    "crates/symworx-backend",
    "crates/symworx-biosym",
    "crates/symworx-core",
    "crates/symworx-dynamics",
    "crates/symworx-embed",
    "crates/symworx-io",
    "crates/symworx-loadsym",
    "crates/symworx-math",
    "crates/symworx-signal",
    "crates/symworx-spatialsym",
    "crates/symworx-stats",
    "crates/symworx-tui",
    "crates/symworx-loadsym-db",
    "bindings/python", 
]

[workspace.package]
version    = "0.1.0"
edition    = "2024"
license    = "Apache-2.0"
repository = "https://github.com/symworx/symworx"
authors    = ["nate berry <symworx.dev@gmail.com>"]

[workspace.dependencies]
csv                 = { version = "1.3" }
ndarray             = { version = "0.15", features = ["std"] }
ndarray-linalg      = { version = "0.16", features = ["openblas"] }
openblas-build      = { version = "0.10", features = ["rustls"] }
num-complex         = { version = "0.4" }
parquet             = { version = "52.0", default-features = false }
brotli-decompressor = { version = "4.0", features = ["std"] }
brotli              = { version = "6.0", features = ["std"] }
alloc-no-stdlib     = { version = "3.0" }
pyo3                = { version = "0.23", features = ["extension-module", "abi3-py312"] }
rand                = { version = "0.9" }
rand_distr          = { version = "0.5" }
rustfft             = { version = "6.4.1" }
thiserror           = { version = "2.0.17" }
tokio               = { version = "1", features = ["full"] }
# Polars (dataframes + parquet/csv/lazy) — currently used in symworx-tui.
# This is a heavy dependency (brings arrow, multiple compression backends, etc.).
# Keep usage opt-in where possible. We centralize the version here for consistency
# in case we want/need polars in other crates later.
polars         = { version = "0.51" }
fitparser      = { version = "0.11" }

# Internal crates — path for monorepo builds; version for crates.io (path stripped on publish).
# Keep `version` in lockstep with [workspace.package] version (Cargo does not allow
# version.workspace = true inside [workspace.dependencies]).
# Members depend via `{ workspace = true }` (+ optional features).
symworx-error      = { path = "crates/symworx-error", version = "0.1.0" }
symworx-math       = { path = "crates/symworx-math", version = "0.1.0" }
symworx-io         = { path = "crates/symworx-io", version = "0.1.0" }
symworx-stats      = { path = "crates/symworx-stats", version = "0.1.0" }
symworx-signal     = { path = "crates/symworx-signal", version = "0.1.0" }
symworx-dynamics   = { path = "crates/symworx-dynamics", version = "0.1.0" }
symworx-backend    = { path = "crates/symworx-backend", version = "0.1.0" }
symworx-embed      = { path = "crates/symworx-embed", version = "0.1.0" }
symworx-loadsym-db = { path = "crates/symworx-loadsym-db", version = "0.1.0" }
symworx-core       = { path = "crates/symworx-core", version = "0.1.0" }
symworx-biosym     = { path = "crates/symworx-biosym", version = "0.1.0" }
symworx-loadsym    = { path = "crates/symworx-loadsym", version = "0.1.0" }
symworx-spatialsym = { path = "crates/symworx-spatialsym", version = "0.1.0" }
symworx-tui        = { path = "crates/symworx-tui", version = "0.1.0" }

[workspace.lints.rust]
# We use `deny` (not `forbid`) for `unsafe_code` because this workspace
# deliberately depends on `ndarray` (and `ndarray-linalg`) for
# performance-critical array operations across signal processing
# (symworx-signal), nonlinear dynamics (RQA), biosym generators, and stats.
#
# - In `symworx-stats` the heavy `ndarray-linalg` (SVD/PCA/l2-l1 regression)
#   is gated behind an opt-in `linalg` feature (off by default in the crate;
#   enabled by default via `symworx-core` for convenience).
# - `symworx-signal` imports it directly/unconditionally because advanced LA
#   (deconvolution, NNLS, etc.) is core to the crate.
#
# `polars` (dataframes, parquet, csv, lazy) is also heavy (pulls arrow + multiple
# compression backends). It is centralized here for version consistency (we may
# use it beyond the TUI in the future) but should remain opt-in via features in
# consuming crates (see the `polars` feature in symworx-tui for optional
# in-memory DataFrame work *after* loading via symworx-io; the `parquet`
# feature on symworx-io itself is used for actual Parquet I/O and is enabled
# for the TUI by default).
#
# `ndarray`'s internals and macros (e.g. `s![]`, `slice_mut`, views, etc.)
# use unsafe for speed and to implement zero-copy slicing. Using `forbid`
# overrules the `#[allow(unsafe_code)]` attributes that ndarray places
# around those expansions, producing errors even on ordinary safe API use.
#
# `deny` still gives strong protection: any direct `unsafe {}` we write
# in our own code will cause a build error unless we add a targeted
# `#[allow(unsafe_code)]` with a safety justification immediately next to it.
#
# We keep the policy at the project root (no per-crate `[lints]` overrides)
# so the rule is uniform and easy to maintain.
unsafe_code = "deny"

[workspace.lints.clippy]
# Pragmatic clippy configuration for the codebase.
# Kept relativley lightweight to avoid pedantic global checks.
# Can still use `#[allow(...)]` attributes where justified.
manual_map = "warn"
needless_pass_by_value = "warn"
redundant_pub_crate = "warn"

# We already use some uncommon naming conventions for builder-style
# APIs (e.g. `Resample::to_len`, `to_rate`) and PyO3 wrappers.
wrong_self_convention = "allow"
