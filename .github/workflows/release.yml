# Release validation + publish.
# SymWorx org standard (default branch `worx`).
# See DEVELOPMENT.md for additional information.
#
# GitHub Flow:
#   feature/* ──PR──► worx ──tag──► vX.Y.Z
# Optional freeze: push to release/** then PR back to worx.
#
# Validation (meta, fmt, clippy/tests, Python + wheel smoke) runs on:
#   - PRs into main (legacy freeze PRs during cutover)
#   - pushes to release/**
#   - tags v*
#   - workflow_dispatch (checks only; does not publish)
#
# Publish (crates.io, GHCR symview image, GitHub Release) runs only on tags
# v*, after validation succeeds. PyPI is paused. Create tags manually on worx.

name: Release

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "release/**"
    tags:
      - "v*"
  # Re-run validation on a branch without publishing.
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # ---------------------------------------------------------------------------
  # Metadata: version / changelog / branch conventions for the release path
  # ---------------------------------------------------------------------------
  release-meta:
    name: Release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      is_tag: ${{ steps.meta.outputs.is_tag }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE_VERSION=$(
            awk '
              $0 ~ /^\[workspace\.package\]/ { in_pkg=1; next }
              in_pkg && $0 ~ /^\[/ { in_pkg=0 }
              in_pkg && $0 ~ /^version/ {
                if (match($0, /"[^"]+"/)) {
                  print substr($0, RSTART+1, RLENGTH-2)
                  exit
                }
              }
            ' Cargo.toml
          )
          if [[ -z "${WORKSPACE_VERSION}" ]]; then
            echo "::error::Could not read [workspace.package] version from Cargo.toml"
            exit 1
          fi
          echo "workspace_version=${WORKSPACE_VERSION}"

          IS_TAG=false
          IS_PRERELEASE=false
          TAG_VERSION=""
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            IS_TAG=true
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "${TAG_VERSION}" == *-* ]]; then
              IS_PRERELEASE=true
            fi
          fi

          # release/vX.Y.Z branch naming (push or PR head)
          BRANCH_REF="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          if [[ "${BRANCH_REF}" == release/* ]]; then
            BRANCH_VERSION="${BRANCH_REF#release/}"
            BRANCH_VERSION="${BRANCH_VERSION#v}"
            if [[ "${BRANCH_VERSION}" != "${WORKSPACE_VERSION}" ]]; then
              echo "::error::release branch '${BRANCH_REF}' version (${BRANCH_VERSION}) does not match Cargo.toml workspace version (${WORKSPACE_VERSION})"
              exit 1
            fi
          fi

          if [[ "${IS_TAG}" == "true" ]]; then
            if [[ "${TAG_VERSION}" != "${WORKSPACE_VERSION}" ]]; then
              echo "::error::Tag v${TAG_VERSION} does not match Cargo.toml workspace version ${WORKSPACE_VERSION}"
              exit 1
            fi
            # Final releases should land on worx; develop/main remain valid during the rename.
            if [[ "${IS_PRERELEASE}" != "true" ]]; then
              trunk=""
              for b in worx develop main; do
                git fetch --no-tags origin "$b:refs/remotes/origin/$b" 2>/dev/null || true
                if git rev-parse --verify "origin/$b" >/dev/null 2>&1; then
                  trunk=$b
                  break
                fi
              done
              if [[ -n "${trunk}" ]]; then
                if git merge-base --is-ancestor HEAD "origin/${trunk}" 2>/dev/null; then
                  echo "Tag commit is on ${trunk} (or an ancestor of ${trunk})."
                else
                  echo "::warning::Tag v${TAG_VERSION} is not an ancestor of ${trunk}. Final releases should be tagged on worx."
                fi
              else
                echo "::warning::No trunk branch (worx/develop/main) found; skipping ancestor check for tag v${TAG_VERSION}."
              fi
            fi
          fi

          # CHANGELOG: require a heading for this version (final and pre-release tags,
          # and release/* branches). Keep Unreleased PRs to worx flexible.
          if [[ "${IS_TAG}" == "true" || "${BRANCH_REF}" == release/* ]]; then
            if ! grep -Eq "^## \[${WORKSPACE_VERSION}\]" CHANGELOG.md; then
              echo "::error::CHANGELOG.md missing '## [${WORKSPACE_VERSION}]' section for this release"
              exit 1
            fi
          fi

          {
            echo "version=${WORKSPACE_VERSION}"
            echo "is_tag=${IS_TAG}"
            echo "is_prerelease=${IS_PRERELEASE}"
          } >> "${GITHUB_OUTPUT}"

          echo "Release metadata: version=${WORKSPACE_VERSION} is_tag=${IS_TAG} is_prerelease=${IS_PRERELEASE}"
          if [[ "${IS_TAG}" == "true" ]]; then
            echo "Tag push: publish jobs will run after validation succeeds."
          else
            echo "Branch/PR: validation only (publish runs on tags v* only)."
          fi

  # ---------------------------------------------------------------------------
  # Validation matrix (same science package set as ci.yml; plus wheel smoke)
  # ---------------------------------------------------------------------------
  fmt:
    name: Format (nightly rustfmt)
    runs-on: ubuntu-latest
    needs: release-meta
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly Rust (rustfmt)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      # Keep in lockstep with ci.yml fmt. TUI excluded (fmt cost / OpenBLAS-heavy).
      # Order follows crates.io publish order (foundation → mid → products).
      - name: Format check (library + bindings, no TUI)
        run: |
          cargo +nightly fmt --check \
            -p symworx-error \
            -p symworx-math \
            -p symworx-io \
            -p symworx-stats \
            -p symworx-signal \
            -p symworx-dynamics \
            -p symworx-backend \
            -p symworx-embed \
            -p symworx-loadsym-db \
            -p symworx-dbsym \
            -p symworx-dbsym-tui \
            -p symworx-core \
            -p symworx-biosym \
            -p symworx-loadsym \
            -p symworx-spatialsym \
            -p symworx-python

  rust-checks:
    name: Clippy + unit tests
    runs-on: ubuntu-latest
    needs: release-meta
    # System OpenBLAS linking (same policy as ci.yml — keep math free of OpenBLAS deps).
    env:
      RUSTFLAGS: "-C link-arg=-lopenblas"
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install system OpenBLAS + Fortran
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gfortran pkg-config libopenblas-dev

      - name: Prefer system OpenBLAS (skip source compile)
        run: |
          sed -i 's/features = \["openblas"\]/features = ["openblas-system"]/' Cargo.toml
          grep -n 'ndarray-linalg' Cargo.toml

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-sys-openblas-release

      # Same science set as ci.yml rust-checks (develop catches these early).
      # Order follows crates.io publish order: error → math → mid → products.
      # TUI excluded from CI clippy; included in the publish-crates job below.
      - name: Clippy + unit tests (science set)
        run: |
          set -euo pipefail
          PKGS=(
            -p symworx-error
            -p symworx-math
            -p symworx-io
            -p symworx-stats
            -p symworx-signal
            -p symworx-dynamics
            -p symworx-backend
            -p symworx-embed
            -p symworx-loadsym-db
            -p symworx-dbsym
            -p symworx-dbsym-tui
            -p symworx-core
            -p symworx-biosym
            -p symworx-loadsym
            -p symworx-spatialsym
          )
          cargo clippy --lib --no-deps "${PKGS[@]}" -- -D warnings
          cargo test --lib "${PKGS[@]}" -- --quiet
          cargo clippy --lib --no-deps -p symworx-dbsym --features sqlite -- -D warnings
          cargo test --lib -p symworx-dbsym --features sqlite -- --quiet

  python-bindings:
    name: Python bindings
    runs-on: ubuntu-latest
    needs: release-meta
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system OpenBLAS + Fortran
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gfortran pkg-config libopenblas-dev

      - name: Prefer system OpenBLAS (skip source compile)
        run: |
          sed -i 's/features = \["openblas"\]/features = ["openblas-system"]/' Cargo.toml

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-sys-openblas-release
          workspaces: |
            . -> target
            bindings/python -> target

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create venv and install tools
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install "maturin>=1.5,<2.0" pytest

      - name: Build Python bindings in development mode
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
        run: |
          .venv/bin/maturin develop --manifest-path bindings/python/Cargo.toml

      - name: Run Python tests
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
          PATH: ${{ github.workspace }}/.venv/bin:${{ env.PATH }}
        run: .venv/bin/pytest bindings/python/tests/ -q --tb=line

      # Local wheel smoke only — does NOT upload to PyPI.
      - name: Build release wheels (smoke, no upload)
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
        run: |
          .venv/bin/maturin build --release --manifest-path bindings/python/Cargo.toml \
            -o dist/wheels
          ls -la dist/wheels

  # Aggregate gate used by branch protection / required checks
  release-ready:
    name: Release checks passed
    runs-on: ubuntu-latest
    needs: [release-meta, fmt, rust-checks, python-bindings]
    if: always()
    steps:
      - name: Require all validation jobs
        run: |
          set -euo pipefail
          echo "release-meta: ${{ needs.release-meta.result }}"
          echo "fmt: ${{ needs.fmt.result }}"
          echo "rust-checks: ${{ needs.rust-checks.result }}"
          echo "python-bindings: ${{ needs.python-bindings.result }}"
          test "${{ needs.release-meta.result }}" = "success"
          test "${{ needs.fmt.result }}" = "success"
          test "${{ needs.rust-checks.result }}" = "success"
          test "${{ needs.python-bindings.result }}" = "success"
          echo "All release validation jobs passed for v${{ needs.release-meta.outputs.version }}"
          echo "On tag pushes: publish-crates, then publish-image, plus github-release (PyPI paused)."

  # ===========================================================================
  # Publish — only on tags v* after validation succeeds
  #
  # Requires:
  #   - GitHub Environment `crates-io` with secret CARGO_REGISTRY_TOKEN
  #   - packages: write on GITHUB_TOKEN for ghcr.io/symworx/symview
  #   - permissions for softprops/action-gh-release on the default GITHUB_TOKEN
  #   - (paused) Environment `pypi` + trusted publisher when re-enabling publish-python
  # ===========================================================================

  publish-crates:
    name: Publish crates.io
    runs-on: ubuntu-latest
    needs: [release-meta, release-ready]
    if: needs.release-meta.outputs.is_tag == 'true' && needs.release-ready.result == 'success'
    environment: crates-io
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish workspace crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          publish_one() {
            local pkg="$1"
            echo "::group::cargo publish -p ${pkg}"
            cargo publish -p "${pkg}" --no-verify
            echo "::endgroup::"
            sleep 5
          }
          # Order from DEVELOPMENT.md (foundation → mid-layer → products)
          publish_one symworx-error
          publish_one symworx-math
          publish_one symworx-io
          publish_one symworx-stats
          publish_one symworx-signal
          publish_one symworx-dynamics
          publish_one symworx-backend
          publish_one symworx-embed
          publish_one symworx-loadsym-db
          publish_one symworx-dbsym
          publish_one symworx-dbsym-tui
          publish_one symworx-core
          publish_one symworx-biosym
          publish_one symworx-loadsym
          publish_one symworx-spatialsym
          publish_one symworx-tui

  # Image install uses the crates.io binary, so this waits until publish-crates
  # has uploaded symworx-tui. Final tags also move :latest. Pre-releases do not.
  publish-image:
    name: Publish GHCR (symview)
    runs-on: ubuntu-latest
    needs: [release-meta, release-ready, publish-crates]
    if: needs.release-meta.outputs.is_tag == 'true' && needs.release-ready.result == 'success' && needs.publish-crates.result == 'success'
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # cargo install reads the sparse index, which lags the publish API.
      - name: Wait for symworx-tui on the crates.io index
        env:
          VERSION: ${{ needs.release-meta.outputs.version }}
        run: |
          set -euo pipefail
          url="https://index.crates.io/sy/mw/symworx-tui"
          for i in $(seq 1 30); do
            if curl -fsSL -A "symworx-release (github.com/symworx/symworx)" "$url" \
              | grep -F "\"vers\":\"${VERSION}\"" >/dev/null; then
              echo "symworx-tui ${VERSION} is on the crates.io index"
              exit 0
            fi
            echo "waiting for crates.io index (${i}/30)"
            sleep 20
          done
          echo "::error::symworx-tui ${VERSION} not visible on the crates.io index"
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: tags
        env:
          VERSION: ${{ needs.release-meta.outputs.version }}
          PRERELEASE: ${{ needs.release-meta.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          {
            echo "list<<EOF"
            echo "ghcr.io/symworx/symview:${VERSION}"
            if [[ "${PRERELEASE}" != "true" ]]; then
              echo "ghcr.io/symworx/symview:latest"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: containers
          file: containers/symview.Containerfile
          push: true
          # Registry image only. Provenance adds an attestation manifest.
          provenance: false
          build-args: |
            SYMWORX_VERSION=${{ needs.release-meta.outputs.version }}
            INSTALL_MODE=crates
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=https://github.com/symworx/symworx
            org.opencontainers.image.version=${{ needs.release-meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.title=symview
            org.opencontainers.image.description=SymWorx keyboard-driven TUI (symview)
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check symview is on PATH
        run: |
          docker run --rm --entrypoint bash \
            "ghcr.io/symworx/symview:${{ needs.release-meta.outputs.version }}" \
            -c 'command -v symview'

  # ---------------------------------------------------------------------------
  # PyPI publish — PAUSED. Validation still builds a wheel smoke artifact
  # in `python-bindings` (no upload).
  # ---------------------------------------------------------------------------
  # publish-python:
  #   name: Publish PyPI
  #   runs-on: ubuntu-latest
  #   needs: [release-meta, release-ready]
  #   if: needs.release-meta.outputs.is_tag == 'true' && needs.release-ready.result == 'success'
  #   environment: pypi
  #   permissions:
  #     id-token: write
  #     contents: read
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: dtolnay/rust-toolchain@stable
  #     - name: Install system OpenBLAS + Fortran
  #       run: |
  #         sudo apt-get update
  #         sudo apt-get install -y --no-install-recommends \
  #           gfortran pkg-config libopenblas-dev
  #     - name: Prefer system OpenBLAS (skip source compile)
  #       run: sed -i 's/features = \["openblas"\]/features = ["openblas-system"]/' Cargo.toml
  #     - uses: actions/setup-python@v5
  #       with:
  #         python-version: "3.12"
  #     - name: Build and publish symworx wheel (trusted publishing)
  #       uses: PyO3/maturin-action@v1
  #       with:
  #         command: publish
  #         args: --manifest-path bindings/python/Cargo.toml --skip-existing
  #         manylinux: auto

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [release-meta, release-ready]
    if: needs.release-meta.outputs.is_tag == 'true' && needs.release-ready.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release-meta.outputs.version }}
          name: v${{ needs.release-meta.outputs.version }}
          prerelease: ${{ needs.release-meta.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
