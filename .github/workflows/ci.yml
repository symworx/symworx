name: CI

on:
  push:
    branches: [develop, main, staging]
  pull_request:
    branches: [develop, main, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly Rust (rustfmt)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Format check (library + bindings, no TUI)
        run: |
          cargo +nightly fmt --check \
            -p symworx-error \
            -p symworx-math \
            -p symworx-io \
            -p symworx-stats \
            -p symworx-dynamics \
            -p symworx-backend \
            -p symworx-signal \
            -p symworx-core \
            -p symworx-biosym \
            -p symworx-loadsym \
            -p symworx-loadsym-db \
            -p symworx-spatialsym \
            -p symworx-python

  rust-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Use distro OpenBLAS instead of OpenBLAS-from-source.
      # Cuts down on build time...
      - name: Install system OpenBLAS + Fortran
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gfortran pkg-config libopenblas-dev

      - name: Prefer system OpenBLAS (skip source compile)
        run: |
          # Workspace defaults to features = ["openblas"] (builds openblas-src).
          # CI switches to openblas-system for speed; local dev can keep source build.
          sed -i 's/features = \["openblas"\]/features = ["openblas-system"]/' Cargo.toml
          grep -n 'ndarray-linalg' Cargo.toml

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # Separate cache key namespace so openblas-system artifacts don't clash
          # with local/source openblas builds if keys overlap.
          prefix-key: v1-sys-openblas

      # One compile graph: clippy typechecks libs; tests reuse target/
      - name: Clippy + unit tests (science crates)
        run: |
          set -euo pipefail
          PKGS=(
            -p symworx-math
            -p symworx-dynamics
            -p symworx-io
            -p symworx-biosym
            -p symworx-loadsym
            -p symworx-spatialsym
          )
          cargo clippy --lib --no-deps "${PKGS[@]}" -- -D warnings
          cargo test --lib "${PKGS[@]}" -- --quiet

  python-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system OpenBLAS + Fortran
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gfortran pkg-config libopenblas-dev

      - name: Prefer system OpenBLAS (skip source compile)
        run: |
          sed -i 's/features = \["openblas"\]/features = ["openblas-system"]/' Cargo.toml

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-sys-openblas
          workspaces: |
            . -> target
            bindings/python -> target

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create venv and install tools
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install "maturin>=1.5,<2.0" pytest

      - name: Build Python bindings in development mode
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
        run: |
          .venv/bin/maturin develop --manifest-path bindings/python/Cargo.toml

      - name: Run Python tests
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
          PATH: ${{ github.workspace }}/.venv/bin:${{ env.PATH }}
        run: .venv/bin/pytest bindings/python/tests/ -q --tb=line
