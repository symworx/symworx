name: CI

on:
  push:
    branches: [develop, main, "nb/*", "joss*"]
  pull_request:
    branches: [develop, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Cargo check (key crates)
        # Note: Checking the full workspace (or TUI) will pull ndarray-linalg + OpenBLAS.
        # We check the scientifically important crates here for faster feedback.
        run: |
          cargo check -p symworx-core -p symworx-math -p symworx-dynamics \
                      -p symworx-biosym -p symworx-io -p symworx-loadsym -p symworx-spatialsym

      - name: Test (core scientific + supporting crates)
        # These crates contain the majority of the library tests (RQA, CPG, gait, loadsym, spatial, io, math).
        run: |
          cargo test -p symworx-core -p symworx-math -p symworx-dynamics \
                     -p symworx-biosym -p symworx-io -p symworx-loadsym -p symworx-spatialsym \
                     -- --quiet

      - name: Clippy (warnings as errors on key crates)
        run: |
          cargo clippy -p symworx-core -p symworx-dynamics -p symworx-math \
                       -p symworx-biosym -p symworx-io -p symworx-loadsym -p symworx-spatialsym \
                       -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

  tui-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check TUI
        run: cargo check -p symworx-tui

      - name: Check TUI with polars feature (in-memory only)
        run: cargo check -p symworx-tui --features polars

      - name: Build symview binary (smoke)
        run: cargo build -p symworx-tui --bin symview --quiet

  python-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install maturin and pytest
        run: pip install "maturin>=1.5,<2.0" pytest

      - name: Build Python bindings in development mode
        # Uses the main pyproject.toml which builds the unified symworx module
        run: maturin develop --manifest-path bindings/python/Cargo.toml

      - name: Run Python tests
        run: pytest bindings/python/tests/ -q --tb=line

  # Note on heavy dependencies:
  # symworx-signal has an *unconditional* dependency on ndarray-linalg (OpenBLAS).
  # symworx-core re-exports it, and symworx-tui depends on signal.
  # Therefore any job that checks/builds the TUI or does full workspace work will compile
  # the native OpenBLAS stack (can take 5-15+ minutes on cold cache).
  #
  # The strategy here is:
  # - Fast/important library tests on biosym, dynamics (RQA), math, loadsym, spatialsym, io.
  # - Separate TUI job that pays the cost + builds the `symview` binary.
  # - Python bindings job (which transitively pulls core → signal).
  #
  # For full signal/stats linalg validation, run manually or add a scheduled "heavy" job later.
