name: CI

on:
  push:
    branches: [develop, main, staging, symworx-loadsym]
  pull_request:
    branches: [develop, main, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Fast lint: format must match rustfmt.toml (unstable import options need nightly).
  # TUI is excluded for now — large formatting debt and not part of the active
  # library CI surface. Re-include crates/symworx-tui once that crate is stabilized.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly Rust (rustfmt)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Format check (nightly; library + bindings, no TUI)
        # -p is a cargo-fmt option (before --); --check is also cargo-fmt, not rustfmt.
        run: |
          cargo +nightly fmt --check \
            -p symworx-error \
            -p symworx-math \
            -p symworx-io \
            -p symworx-stats \
            -p symworx-dynamics \
            -p symworx-backend \
            -p symworx-signal \
            -p symworx-core \
            -p symworx-biosym \
            -p symworx-loadsym \
            -p symworx-loadsym-db \
            -p symworx-spatialsym \
            -p symworx-python

  rust-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install OpenBLAS build deps
        # symworx-core / biosym / loadsym pull signal → ndarray-linalg (openblas).
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gfortran pkg-config

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Clippy (warnings as errors on key library crates)
        # --lib: skip unfinished/optional binaries (e.g. symload helpers).
        # --no-deps: only lint the packages listed (path deps are typechecked but not linted).
        # TUI intentionally omitted (heavy + still evolving).
        # spatialsym is tested below but excluded from strict clippy for now
        # (missing_docs + style debt); re-enable once cleaned up.
        run: |
          cargo clippy --lib --no-deps \
            -p symworx-core -p symworx-dynamics -p symworx-math \
            -p symworx-biosym -p symworx-io -p symworx-loadsym \
            -- -D warnings

      - name: Test (core scientific + supporting crates)
        run: |
          cargo test -p symworx-core -p symworx-math -p symworx-dynamics \
                     -p symworx-biosym -p symworx-io -p symworx-loadsym -p symworx-spatialsym \
                     -- --quiet

  # TUI smoke builds (symview + polars) are disabled for now.
  # They routinely cost 10–20+ minutes cold (OpenBLAS + full TUI graph) and are
  # not required while library / Python work is the active focus.
  # Re-add as a scheduled or manual workflow when the TUI is ready for gatekeeping.

  python-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install build deps (OpenBLAS for core → signal)
        # Python default build does not enable the optional `email` feature
        # (no OpenSSL). Re-add libssl-dev if CI starts building with --features email.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gfortran pkg-config

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            bindings/python -> target

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create venv and install tools
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install "maturin>=1.5,<2.0" pytest

      - name: Build Python bindings in development mode
        # pyo3 already enables extension-module via workspace Cargo.toml —
        # do not pass --features extension-module (that flag is not a package feature).
        # Explicit VIRTUAL_ENV so maturin always finds the venv.
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
        run: |
          .venv/bin/maturin develop --manifest-path bindings/python/Cargo.toml

      - name: Run Python tests
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
          PATH: ${{ github.workspace }}/.venv/bin:${{ env.PATH }}
        run: .venv/bin/pytest bindings/python/tests/ -q --tb=line

  # Strategy (2026-07):
  # - fmt: nightly rustfmt on library + Python binding crates (not TUI).
  # - rust-checks: clippy -D warnings + unit tests for science crates.
  # - python-bindings: venv + maturin develop + pytest (core/biosym/loadsym surface).
  # - TUI: local / manual only until OpenBLAS + UI debt is under control.
  #
  # Note: any job that builds crates depending on symworx-core still compiles
  # OpenBLAS (via signal → ndarray-linalg). That is expected and cached by
  # rust-cache after the first run.
