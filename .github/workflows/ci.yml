name: CI

on:
  push:
    branches: [develop, main, staging]
  pull_request:
    branches: [develop, main, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Fast lint: format must match rustfmt.toml (unstable import options need nightly).
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly Rust (rustfmt)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Format check (nightly, matches rustfmt.toml)
        run: cargo +nightly fmt --all -- --check

  rust-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Clippy (warnings as errors on key crates)
        # --lib: skip unfinished binaries (e.g. symload helpers).
        # --no-deps: only lint the packages listed (path deps like signal are not linted here).
        # Clippy typechecks; a separate cargo check is redundant.
        # spatialsym is tested below but excluded from strict clippy for now
        # (missing_docs + style debt); re-enable once cleaned up.
        run: |
          cargo clippy --lib --no-deps \
            -p symworx-core -p symworx-dynamics -p symworx-math \
            -p symworx-biosym -p symworx-io -p symworx-loadsym \
            -- -D warnings

      - name: Test (core scientific + supporting crates)
        run: |
          cargo test -p symworx-core -p symworx-math -p symworx-dynamics \
                     -p symworx-biosym -p symworx-io -p symworx-loadsym -p symworx-spatialsym \
                     -- --quiet

  tui-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # Builds pay OpenBLAS cost once; implies a successful typecheck of the TUI graph.
      - name: Build symview binary (smoke)
        run: cargo build -p symworx-tui --bin symview --quiet

      - name: Check TUI with polars feature (in-memory only)
        run: cargo check -p symworx-tui --features polars

  python-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            bindings/python -> target

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create venv and install tools
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install "maturin>=1.5,<2.0" pytest

      - name: Build Python bindings in development mode
        # Uses the main pyproject.toml which builds the unified symworx module
        run: .venv/bin/maturin develop --manifest-path bindings/python/Cargo.toml

      - name: Run Python tests
        run: .venv/bin/pytest bindings/python/tests/ -q --tb=line

  # Note on heavy dependencies:
  # symworx-signal has an *unconditional* dependency on ndarray-linalg (OpenBLAS).
  # symworx-core re-exports it, and symworx-tui depends on signal.
  # Therefore any job that checks/builds the TUI or does full workspace work will compile
  # the native OpenBLAS stack (can take 5-15+ minutes on cold cache).
  #
  # The strategy here is:
  # - Fast fmt job (nightly rustfmt) with no compile.
  # - Library clippy + tests on biosym, dynamics (RQA), math, loadsym, spatialsym, io.
  # - Separate TUI job that pays the OpenBLAS cost + builds the `symview` binary.
  # - Python bindings job (venv + maturin; transitively pulls core → signal).
  #
  # For full signal/stats linalg validation, run manually or add a scheduled "heavy" job later.
