# Day-to-day CI (see DEVELOPMENT.md).
#
# Day-to-day CI on develop only. stage/main are FF promotions of that SHA.
# Tag / release.yml re-runs the full gate before publish.
# workflow_dispatch re-runs this gate on a branch (checks only; no publish).

name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly Rust (rustfmt)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      # Same library set as release.yml (TUI excluded: fmt cost / OpenBLAS-heavy graph).
      - name: Format check (library + bindings, no TUI)
        run: |
          cargo +nightly fmt --check \
            -p symworx-error \
            -p symworx-math \
            -p symworx-io \
            -p symworx-stats \
            -p symworx-signal \
            -p symworx-dynamics \
            -p symworx-backend \
            -p symworx-embed \
            -p symworx-loadsym-db \
            -p symworx-core \
            -p symworx-biosym \
            -p symworx-loadsym \
            -p symworx-spatialsym \
            -p symworx-python

  rust-checks:
    runs-on: ubuntu-latest
    # ------------------------------------------------------------------
    # System OpenBLAS linking (CI-only; keep symworx-math free of OpenBLAS)
    #
    # Why this exists:
    #   Several science crates (dynamics/signal/stats+linalg) depend on
    #   ndarray-linalg → OpenBLAS. Cargo feature-unifies `ndarray` so the
    #   BLAS backend can apply to the whole multi-package `cargo test`
    #   graph — including crates like symworx-math that only call small
    #   ndarray ops (e.g. `.dot()`) and intentionally do NOT depend on
    #   openblas-src. Those test binaries then need CBLAS symbols at link
    #   time (`cblas_ddot` / `cblas_sdot`) but nothing in their crate
    #   graph emits `-lopenblas`.
    #
    # What we do instead of a crate-level OpenBLAS dep on math:
    #   1. Install distro libopenblas-dev (below).
    #   2. Prefer openblas-system over compiling OpenBLAS from source.
    #   3. Pass RUSTFLAGS so the linker always resolves system OpenBLAS.
    #
    # Policy: keep math light (pure-Rust primitives, no native LA).
    # Heavy LA stays in stats/signal/dynamics. Do not "fix" this by
    # adding OpenBLAS as a default dependency of symworx-math unless
    # we grow this project and it becomes a critical addition to the
    # overall functionality and offering.
    # ------------------------------------------------------------------
    env:
      RUSTFLAGS: "-C link-arg=-lopenblas"
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Use distro OpenBLAS instead of OpenBLAS-from-source.
      # Cuts down on build time; required for RUSTFLAGS=-lopenblas above.
      - name: Install system OpenBLAS + Fortran
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gfortran pkg-config libopenblas-dev

      - name: Prefer system OpenBLAS (skip source compile)
        run: |
          # Workspace defaults to features = ["openblas"] (builds openblas-src).
          # CI switches to openblas-system for speed; local dev can keep source build.
          sed -i 's/features = \["openblas"\]/features = ["openblas-system"]/' Cargo.toml
          grep -n 'ndarray-linalg' Cargo.toml

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # Separate cache key namespace so openblas-system artifacts don't clash
          # with local/source openblas builds if keys overlap.
          prefix-key: v1-sys-openblas

      # Same science package set as release.yml rust-checks (publish order; TUI excluded).
      - name: Clippy + unit tests (science crates)
        run: |
          set -euo pipefail
          PKGS=(
            -p symworx-error
            -p symworx-math
            -p symworx-io
            -p symworx-stats
            -p symworx-signal
            -p symworx-dynamics
            -p symworx-backend
            -p symworx-embed
            -p symworx-loadsym-db
            -p symworx-core
            -p symworx-biosym
            -p symworx-loadsym
            -p symworx-spatialsym
          )
          cargo clippy --lib --no-deps "${PKGS[@]}" -- -D warnings
          cargo test --lib "${PKGS[@]}" -- --quiet

  python-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system OpenBLAS + Fortran
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gfortran pkg-config libopenblas-dev

      - name: Prefer system OpenBLAS (skip source compile)
        run: |
          sed -i 's/features = \["openblas"\]/features = ["openblas-system"]/' Cargo.toml

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-sys-openblas
          workspaces: |
            . -> target
            bindings/python -> target

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create venv and install tools
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install "maturin>=1.5,<2.0" pytest

      - name: Build Python bindings in development mode
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
        run: |
          .venv/bin/maturin develop --manifest-path bindings/python/Cargo.toml

      - name: Run Python tests
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
          PATH: ${{ github.workspace }}/.venv/bin:${{ env.PATH }}
        run: .venv/bin/pytest bindings/python/tests/ -q --tb=line
