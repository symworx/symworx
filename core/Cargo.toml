# core/src/Cargo.toml
#

[package]
name = "symworx-core"
version = "0.1.0"
edition = "2024"

[dependencies]
csv             = { version = "1.3" }
# edf             = { version = "0.0.0-alpha.0" }
ndarray         = { version = "0.15", features = ["std"] }
ndarray-linalg  = { version = "0.16", features = ["openblas"] }
numpy           = { version = "0.21" }
parquet         = { version = "51.0" }
pyo3            = { version = "0.21", features = ["extension-module"] }
rand            = { version = "0.8" }
