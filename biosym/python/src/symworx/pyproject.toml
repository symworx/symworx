[build-system]
requires = ["maturin>=1.4"]
build-backend = "maturin"

[project]
name = "symworx"
version = "0.1.0"
description = "Biosym Rust-backed modeling engine for the C-SYMd ecosystem"
authors = [{ name = "nate berry" }]
requires-python = ">=3.12,<3.14"
readme = "README.md"
packages = [{ include = "symworx" }]

[tool.maturin]
manifest-path = "../Cargo.toml"
bindings = "pyo3"
strip = true
python-source = "src"
module-name = "symworx.biosym.biosym"

# Optional but recommended
license = { text = "" }

[project.urls]
Homepage = "https://github.com/csymd/csymd-symworx"
Source = "https://github.com/csymd/csymd-symworx"
